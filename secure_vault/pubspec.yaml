name: secure_vault
description: >
  A cross-platform secrets & credentials manager — the evolving project
  for the Flutter Forge course. Built with security as a first-class concern.
version: 0.1.0+1

publish_to: none

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────────
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────────
  go_router: ^14.2.7

  # ── Data & Serialization ──────────────────────────────────────
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0
  drift: ^2.18.0
  sqlite3_flutter_libs: ^0.5.23
  path_provider: ^2.1.3
  path: ^1.9.0

  # ── HTTP ──────────────────────────────────────────────────────
  dio: ^5.4.3
  pretty_dio_logger: ^1.3.1   # dev builds only (guard with kDebugMode)

  # ── Security ─────────────────────────────────────────────────
  flutter_secure_storage: ^9.2.2
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  local_auth: ^2.3.0
  crypto: ^3.0.3              # SHA-256 for cert pinning

  # ── Utilities ────────────────────────────────────────────────
  uuid: ^4.4.0
  intl: ^0.19.0
  equatable: ^2.0.5

  # ── UI ────────────────────────────────────────────────────────
  window_manager: ^0.3.8      # desktop window sizing
  flutter_svg: ^2.0.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  drift_dev: ^2.18.0
  riverpod_generator: ^2.4.0

  # Testing
  mocktail: ^1.0.0

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/images/
